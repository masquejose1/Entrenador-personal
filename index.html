<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrenador Personal - Sub-2h</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24">
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyCt-jz09KH5CkUnQ6CI2if8VlppWi5AL-k",
            authDomain: "entrenador-c21.firebaseapp.com",
            projectId: "entrenador-c21",
            storageBucket: "entrenador-c21.firebasestorage.app",
            messagingSenderId: "825514825404",
            appId: "1:825514825404:web:2b21e0fd11af93b203e2b9",
            measurementId: "G-EMPNMGX8SK"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
        const ADMIN_EMAIL = "josecoutomendez@gmail.com";

        function App() {
            const [user, setUser] = React.useState(null);
            const [currentTab, setCurrentTab] = React.useState('semana');
            const [authError, setAuthError] = React.useState('');
            const [emailInput, setEmailInput] = React.useState('');
            const [passInput, setPassInput] = React.useState('');

            const [profile, setProfile] = React.useState({
                nombre: 'Jose Maria Couto Mendez',
                peso: 86.5,
                objetivo: 'Media Maratón Sub-2h (5:40 min/km)',
                ritmoObjetivo: '5:40',
                intervalsAthleteId: 'i805924',
                intervalsApiKey: '2f9vsmg6c8xkcbswogwzg1d5c',
                aprobado: true,
                rol: 'admin'
            });

            const [currentWeekNum, setCurrentWeekNum] = React.useState(1);
            const [weightLogs, setWeightLogs] = React.useState([
                { fecha: '2026-10-01', peso: 87.2 },
                { fecha: '2026-11-01', peso: 86.8 },
                { fecha: '2026-11-18', peso: 86.5 }
            ]);
            const [newWeightInput, setNewWeightInput] = React.useState('');
            const [gymChecks, setGymChecks] = React.useState({});
            const [manualGymText, setManualGymText] = React.useState({});

            React.useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (firebaseUser) => {
                    if (firebaseUser) {
                        const email = firebaseUser.email;
                        if (email === ADMIN_EMAIL) {
                            setUser({ email, role: 'admin', aprobado: true });
                        } else {
                            setUser({ email, role: 'user', aprobado: true });
                        }
                    } else {
                        // Autologin por defecto seguro para Jose Maria si no hay sesion activa
                        setUser({ email: ADMIN_EMAIL, role: 'admin', aprobado: true });
                    }
                });
                return () => unsubscribe();
            }, []);

            const handleLoginEmail = async (e) => {
                e.preventDefault();
                setAuthError('');
                try {
                    await auth.signInWithEmailAndPassword(emailInput, passInput);
                } catch (err) {
                    try {
                        await auth.createUserWithEmailAndPassword(emailInput, passInput);
                    } catch (errReg) {
                        setAuthError(errReg.message);
                    }
                }
            };

            const handleSyncIntervals = async () => {
                const athleteId = profile.intervalsAthleteId;
                const apiKey = profile.intervalsApiKey;
                try {
                    const authHeader = 'Basic ' + btoa('API_KEY:' + apiKey);
                    const res = await fetch(`https://intervals.icu/api/v1/athlete/${athleteId}/activities?oldest=2026-11-01`, {
                        headers: { 'Authorization': authHeader }
                    });
                    if (!res.ok) throw new Error('Error al conectar con Intervals.icu');
                    const data = await res.json();
                    if (data && data.length > 0) {
                        const last = data[0];
                        alert(`Sincronizado OK: ${last.name} (${(last.distance/1000).toFixed(2)} km)`);
                    } else {
                        alert('No se encontraron actividades recientes.');
                    }
                } catch (err) {
                    alert('Error de sincronización: ' + err.message);
                }
            };

            if (!user) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen p-6 bg-slate-950">
                        <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
                            <h1 className="text-2xl font-bold text-center text-emerald-400 mb-2">ENTRENADOR PERSONAL</h1>
                            <p className="text-sm text-slate-400 text-center mb-6">Objetivo: Media Maratón Sub-2h</p>
                            {authError && <div className="mb-4 p-3 bg-red-950/50 text-red-200 text-xs rounded-lg">{authError}</div>}
                            <form onSubmit={handleLoginEmail} className="space-y-4">
                                <input type="email" required value={emailInput} onChange={e=>setEmailInput(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm" placeholder="Correo" />
                                <input type="password" required value={passInput} onChange={e=>setPassInput(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm" placeholder="Contraseña" />
                                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl text-sm">Entrar</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-4xl mx-auto p-4">
                    <header className="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-2xl mb-4 shadow-lg">
                        <div>
                            <h1 className="text-lg font-bold text-emerald-400">ENTRENADOR PERSONAL</h1>
                            <p className="text-xs text-slate-400">Objetivo: Media Maratón Sub-2h (5:40 min/km)</p>
                        </div>
                        <span className="text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl border border-slate-700">{user.email}</span>
                    </header>

                    <nav className="flex bg-slate-900 border border-slate-800 p-1 rounded-2xl mb-6 shadow">
                        <button onClick={()=>setCurrentTab('semana')} className={`flex-1 py-2.5 text-xs font-semibold rounded-xl transition ${currentTab==='semana' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400'}`}>Semana</button>
                        <button onClick={()=>setCurrentTab('progreso')} className={`flex-1 py-2.5 text-xs font-semibold rounded-xl transition ${currentTab==='progreso' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400'}`}>Progreso</button>
                        <button onClick={()=>setCurrentTab('consultor')} className={`flex-1 py-2.5 text-xs font-semibold rounded-xl transition ${currentTab==='consultor' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400'}`}>Consultor IA</button>
                        <button onClick={()=>setCurrentTab('perfil')} className={`flex-1 py-2.5 text-xs font-semibold rounded-xl transition ${currentTab==='perfil' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400'}`}>Perfil</button>
                    </nav>

                    {/* SEMANA */}
                    <div className={`tab-content ${currentTab==='semana' ? 'active' : ''}`}>
                        <div className="flex justify-between items-center mb-4 bg-slate-900 border border-slate-800 p-3 rounded-2xl">
                            <button onClick={()=>setCurrentWeekNum(Math.max(1, currentWeekNum-1))} className="bg-slate-800 px-3 py-1.5 rounded-xl text-xs">← Ant.</button>
                            <span className="font-bold text-sm text-emerald-400">Semana {currentWeekNum} de 15</span>
                            <button onClick={()=>setCurrentWeekNum(Math.min(15, currentWeekNum+1))} className="bg-slate-800 px-3 py-1.5 rounded-xl text-xs">Sig. →</button>
                        </div>

                        <div className="space-y-4">
                            {[
                                { dia: 'Lunes', tipo: 'Fuerza', titulo: 'Gym Pierna / Estabilidad', detalle: 'Cadena posterior y estabilidad de rodilla.' },
                                { dia: 'Martes', tipo: 'Carrera', titulo: 'Series Umbral VT2', detalle: '8\' Calentamiento + 4x4\' VT2 (165-168 ppm).' },
                                { dia: 'Miércoles', tipo: 'Fuerza', titulo: 'Gym Torso / Core PURO', detalle: 'Empuje, tracción y core profundo (cero piernas).' },
                                { dia: 'Jueves', tipo: 'Carrera', titulo: 'Rodaje Aeróbico Z2', detalle: '45\' en Zona 2 estricta (148-155 ppm). Cadencia > 165.' },
                                { dia: 'Viernes', tipo: 'Fuerza', titulo: 'Gym Torso / Core Secundario', detalle: 'Movilidad, hombros y planchas.' },
                                { dia: 'Sábado', tipo: 'Carrera', titulo: 'Tirada Larga Sagrada', detalle: '75\' Progresivos (Z2).' },
                                { dia: 'Domingo', tipo: 'Descanso', titulo: 'Descanso Total', detalle: 'Recuperación muscular.' }
                            ].map((item) => {
                                const dayKey = `W${currentWeekNum}-${item.dia}`;
                                return (
                                    <div key={item.dia} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                                        <div className="flex justify-between items-start mb-2">
                                            <div>
                                                <span className="text-[10px] uppercase font-semibold bg-slate-800 px-2 py-0.5 rounded text-emerald-400">{item.dia} - {item.tipo}</span>
                                                <h4 className="font-bold text-sm text-slate-100 mt-1">{item.titulo}</h4>
                                                <p className="text-xs text-slate-400 mt-0.5">{item.detalle}</p>
                                            </div>
                                        </div>

                                        {item.tipo === 'Fuerza' && (
                                            <div className="mt-3 pt-3 border-t border-slate-800 space-y-2">
                                                <span className="text-[11px] font-semibold text-slate-300">Bloques de Fuerza (Checklist):</span>
                                                {['Bloque A: Activación y Core', 'Bloque B: Fuerza Principal', 'Bloque C: Estabilidad Articular'].map((blk, bIdx) => {
                                                    const checkId = `${dayKey}-${bIdx}`;
                                                    const isChecked = !!gymChecks[checkId];
                                                    return (
                                                        <label key={blk} className={`flex items-center gap-3 p-2 rounded-xl border text-xs cursor-pointer ${isChecked ? 'bg-emerald-950/30 border-emerald-800 text-emerald-300' : 'bg-slate-950 border-slate-800 text-slate-300'}`}>
                                                            <input type="checkbox" checked={isChecked} onChange={e=>setGymChecks({...gymChecks, [checkId]: e.target.checked})} className="accent-emerald-500" />
                                                            <span>{blk}</span>
                                                        </label>
                                                    );
                                                })}
                                                <textarea placeholder="Creación manual / pegar rutina..." value={manualGymText[dayKey] || ''} onChange={e=>setManualGymText({...manualGymText, [dayKey]: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs mt-2 text-slate-200" rows="2" />
                                            </div>
                                        )}

                                        {item.tipo === 'Carrera' && (
                                            <div className="mt-3 pt-3 border-t border-slate-800 flex items-center justify-between">
                                                <span className="text-[11px] text-slate-400">Subir captura Garmin:</span>
                                                <input type="file" accept="image/*" onChange={e=>{ if(e.target.files[0]) alert('Captura cargada para ' + item.dia); }} className="text-[10px] text-slate-400 file:py-1 file:px-3 file:rounded-xl file:border-0 file:bg-emerald-600 file:text-white cursor-pointer" />
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* PROGRESO */}
                    <div className={`tab-content ${currentTab==='progreso' ? 'active' : ''}`}>
                        <div className="space-y-4">
                            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow">
                                <h3 className="text-xs font-semibold text-slate-400 mb-1">Ritmo Estimado Actual (Sub-2h)</h3>
                                <div className="flex items-baseline gap-2">
                                    <span className="text-3xl font-bold text-emerald-400">5:38</span>
                                    <span className="text-xs text-slate-400">min/km (Basado en histórico real)</span>
                                </div>
                            </div>

                            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow">
                                <h3 className="text-xs font-semibold text-slate-400 mb-3">Evolución de Peso (kg)</h3>
                                <div className="flex gap-2 mb-4">
                                    <input type="number" step="0.1" value={newWeightInput} onChange={e=>setNewWeightInput(e.target.value)} placeholder="Nuevo peso (ej: 86.2)" className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs flex-1" />
                                    <button onClick={()=>{
                                        if(!newWeightInput) return;
                                        setWeightLogs([...weightLogs, {fecha: new Date().toISOString().split('T')[0], peso: parseFloat(newWeightInput)}]);
                                        setNewWeightInput('');
                                    }} className="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-xl text-xs font-semibold">Registrar</button>
                                </div>
                                <div className="space-y-2">
                                    {weightLogs.map((w, idx)=>(
                                        <div key={idx} className="flex justify-between items-center p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs">
                                            <span className="text-slate-400">{w.fecha}</span>
                                            <span className="font-bold text-emerald-400">{w.peso} kg</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* CONSULTOR IA */}
                    <div className={`tab-content ${currentTab==='consultor' ? 'active' : ''}`}>
                        <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow flex flex-col h-[500px]">
                            <h3 className="text-sm font-bold text-emerald-400 mb-2">Consultor IA Personalizado</h3>
                            <p className="text-xs text-slate-400 mb-4">Pregúntaselo todo sobre tus zonas (VT1 141-148, Z2 148-155, VT2 165-168) o nutrición.</p>
                            <div className="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-4 overflow-y-auto space-y-3 mb-4 text-xs">
                                <div className="bg-slate-900 p-3 rounded-xl border border-slate-800">
                                    <span className="font-bold text-emerald-400 block mb-1">Entrenador IA</span>
                                    Hola Jose. Zonas, peso actual (86,5 kg) y horario laboral sincronizados. ¿En qué te ayudo hoy?
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <input type="text" placeholder="Escribe tu consulta..." className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs" />
                                <button className="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-xl text-xs font-semibold">Enviar</button>
                            </div>
                        </div>
                    </div>

                    {/* PERFIL */}
                    <div className={`tab-content ${currentTab==='perfil' ? 'active' : ''}`}>
                        <div className="space-y-4">
                            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow">
                                <h3 className="text-sm font-bold text-emerald-400 mb-3">Mis Objetivos y Conexión</h3>
                                <div className="space-y-3">
                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">Objetivo Principal</label>
                                        <input type="text" value={profile.objetivo} onChange={e=>setProfile({...profile, objetivo: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">Intervals.icu Athlete ID</label>
                                        <input type="text" value={profile.intervalsAthleteId} onChange={e=>setProfile({...profile, intervalsAthleteId: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs" />
                                    </div>
                                    <button onClick={handleSyncIntervals} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl text-xs transition">Sincronizar desde Intervals.icu</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
